# ros2_control config for arm_ik_teleop.launch.py in simulation
# (hardware_backend:=fake -> mock_components/GenericSystem, no CAN).
#
# Mirrors hardware_ros2_controllers.yaml so the same ik_mux_vkb controller
# switching works in sim. The trajectory controller commands POSITION here
# (mock hardware perfectly follows position, like planning_ros2_controllers.yaml),
# while the servo controller forwards VELOCITY from MoveIt Servo.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_servo_controller:
      type: forward_command_controller/ForwardCommandController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

# Exactly the SRDF "arm" group (joint1-6) to match MoveIt Servo's command size.
arm_servo_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: velocity

arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# Gripper (joint7) is driven directly by ik_mux_vkb, independent of MoveIt/IK.
# Stays active in every arm sub-mode; does not conflict with the arm controllers
# because it claims a different joint.
gripper_controller:
  ros__parameters:
    joints:
      - joint7
    interface_name: velocity
