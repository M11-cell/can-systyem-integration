# ros2_control config for arm_ik_teleop.launch.py on real CAN hardware
# (hardware_backend:=can -> ArmCanInterface).
#
# Two controllers claim the same velocity command interfaces; only ONE is active
# at a time. ik_mux_vkb switches between them:
#   - arm_servo_controller     (MoveIt Servo: FK joint jog + Cartesian teleop)
#   - arm_trajectory_controller (move_group Plan & Execute / Poses mode)
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_servo_controller:
      type: forward_command_controller/ForwardCommandController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

# Forward velocity commands from MoveIt Servo (/arm_servo_controller/commands).
# Exactly the SRDF "arm" group (joint1-6): Servo publishes one command per joint
# in that group, so this list and its order must match or the controller rejects
# the array. joint7 (gripper) is not in the planning group and is driven
# separately, so it is not commanded here.
arm_servo_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: velocity

# Trajectory execution for move_group. Restricted to the SRDF "arm" planning
# group (joints 1-6); joint7 gripper stays servo-only via joint jog.
# ArmCanInterface exports a velocity command interface plus position/velocity
# state, so the JTC runs in velocity mode. Note: joint4 has no encoder yet, so
# its position state is NaN on hardware — trajectory execution is reliable only
# on the encoder-backed joints until forearm feedback lands (questions.md §F).
arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

# Gripper (joint7 clamp servo) driven directly by ik_mux_vkb, outside of IK.
# ArmCanInterface exports a velocity command interface for joint7. Stays active
# in every arm sub-mode; no conflict with the arm controllers (different joint).
gripper_controller:
  ros__parameters:
    joints:
      - joint7
    interface_name: velocity
